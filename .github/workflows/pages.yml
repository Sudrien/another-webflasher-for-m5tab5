# SPDX-License-Identifier: MIT
name: Publish the flasher

# Publishes the site to GitHub Pages. For now the site is the committed
# files at the repository's root, less the ones that are not the page
# (this workflow, CLAUDE.md). A later step will fetch each project's
# release binaries into _site/ here, which is why this deploys from an
# action rather than from the branch.
#
# Pages must be set to deploy from GitHub Actions (Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions), not from the branch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a
# deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          # exactly the committed files, not anything a step left behind
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/CLAUDE.md
          # refuse to publish without the page
          test -f _site/index.html

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
